{% load static %}

<header id="header">
    <div class="container">
        <nav class="navbar">

            <!-- Left Section - Logo -->
            <div class="logo-section">
                <div class="logo-wrapper">
                    <img src="{% static 'home/images/logo.png' %}" 
                         alt="Infiolo Technology Logo"
                         class="logo-img"
                         onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';">
                </div>

                <div class="logo-text-container">
                    <div class="logo-text">Infiolo</div>
                    <div class="logo-subtitle">TECHNOLOGY PVT.LTD</div>
                </div>
            </div>

            <!-- Center Navigation (Desktop Only) -->
            <div class="nav-section">
                <ul class="nav-links">
                    <li><a href="/" class="active">Home</a></li>
                    <li><a href="{% url 'about' %}">About</a></li>
                    <li><a href="#services">Services</a></li>
                    <li><a href="#products">Products</a></li>
                    <li><a href="#careers">Careers</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </div>

            <!-- Right Section - Widgets (Desktop Only) -->
            <div class="right-section">
                <div class="weather-time-widget">
                    <div class="time-display">
                        <div class="time-icon"><i class="far fa-clock"></i></div>
                        <div class="time-text" id="currentTime">--:--</div>
                        <div class="date-text" id="currentDate">Loading...</div>
                    </div>

                    <div class="weather-display">
                        <div class="weather-icon" id="weatherIcon"><i class="fas fa-cloud-sun"></i></div>
                        <div class="weather-info">
                            <div class="weather-temp" id="weatherTemp">--°C</div>
                            <div class="weather-location" id="weatherLocation">Loading...</div>
                        </div>
                    </div>
                </div>

                <a href="{% url 'login' %}" class="login-btn">Login</a>
            </div>

            <!-- Mobile Menu Button -->
            <div class="mobile-menu">
                <i class="fas fa-bars"></i>
            </div>

        </nav>

        <!-- Mobile Dropdown Menu -->
        <div class="mobile-nav">
            <a href="/">Home</a>
            <a href="{% url 'about' %}">About</a>
            <a href="#services">Services</a>
            <a href="#products">Products</a>
            <a href="#careers">Careers</a>
            <a href="#contact">Contact</a>
            <a href="{% url 'login' %}">Login</a>
        </div>

    </div>
</header>
