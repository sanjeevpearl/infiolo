{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Infiolo Technology Pvt. Ltd.{% endblock %}</title>

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Your full CSS from index.html -->
        <style>
        :root {
            --primary: #3498db;
            --primary-dark: #2980b9;
            --secondary: #e74c3c;
            --secondary-dark: #c0392b;
            --dark: #2c3e50;
            --light: #f8f9fa;
            --text: #333;
            --text-light: #7f8c8d;
            --gradient: linear-gradient(135deg, #3498db, #2c3e50);
            --gradient-hover: linear-gradient(135deg, #2980b9, #34495e);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header & Navigation */
        header {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        header.scrolled {
            padding: 5px 0;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            gap: 30px;
        }

        /* Logo Section - Left */
        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            perspective: 1000px;
        }

        .logo-img {
            height: 60px;
            width: 60px;
            border-radius: 12px;
            object-fit: cover;
            background: var(--primary);
            box-shadow: 
                0 4px 15px rgba(52, 152, 219, 0.3),
                0 8px 25px rgba(52, 152, 219, 0.2);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo-img:hover {
            transform: translateY(-3px) rotate(5deg);
            box-shadow: 
                0 6px 20px rgba(52, 152, 219, 0.4),
                0 12px 30px rgba(52, 152, 219, 0.3);
        }

        .logo-text-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--dark), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .logo-subtitle {
            font-size: 11px;
            color: var(--primary);
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* Navigation Section - Center */
        .nav-section {
            display: flex;
            justify-content: center;
            flex: 2;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 8px;
            align-items: center;
        }

        .nav-links li {
            position: relative;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--dark);
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 15px;
        }

        .nav-links a:hover {
            background: rgba(52, 152, 219, 0.1);
            color: var(--primary);
            transform: translateY(-1px);
        }

        .nav-links a.active {
            background: var(--gradient);
            color: white;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }

        /* Right Section - Weather, Time & Login */
        .right-section {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            justify-content: flex-end;
        }

        /* Compact Weather & Time Widget - Logo Size */
        .weather-time-widget {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 60px; /* Same as logo height */
        }
.time-display {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--gradient);
    color: white;
    padding: 6px 8px;
    border-radius: 8px;
    min-width: 55px;
    height: 55px;
    box-shadow: 0 3px 10px rgba(52, 152, 219, 0.3);
    transition: all 0.3s ease;
    /* Ensure text doesn't overflow */
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

        .time-display:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .time-icon {
            font-size: 12px;
            margin-bottom: 2px;
        }

.time-text {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    line-height: 1;
    /* Ensure text fits within container */
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: center;
}

.date-text {
    font-size: 9px;
    opacity: 0.9;
    margin-top: 1px;
    line-height: 1;
    text-align: center;
    /* Ensure text fits within container */
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

        .weather-display {
            display: flex;
            align-items: center;
            gap: 6px;
            background: white;
            padding: 6px 8px;
            border-radius: 8px;
            height: 55px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .weather-display:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .weather-icon {
            font-size: 16px;
            color: var(--primary);
        }

        .weather-info {
            display: flex;
            flex-direction: column;
            min-width: 45px;
        }

        .weather-temp {
            font-size: 11px;
            font-weight: 600;
            color: var(--dark);
            line-height: 1;
        }

        .weather-location {
            font-size: 9px;
            color: var(--text-light);
            line-height: 1.1;
            margin-top: 2px;
        }

        .login-btn {
            background: var(--gradient);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
            font-weight: 500;
            text-decoration: none;
            white-space: nowrap;
            font-size: 14px;
        }

        .login-btn:hover {
            background: var(--gradient-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(52, 152, 219, 0.4);
        }

        .mobile-menu {
            display: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--dark);
            padding: 8px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .mobile-menu:hover {
            background: rgba(52, 152, 219, 0.1);
            color: var(--primary);
        }

 /* White Hero Section */
.white-hero {
    background: #ffffff;
    padding: 120px 0;
}

.hero-flex {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 40px;
}

.hero-content h1 {
    font-size: 48px;
    font-weight: 800;
    color: #111;
}

.hero-content p {
    max-width: 420px;
    font-size: 18px;
    color: #444;
    margin-bottom: 20px;
}

.hero-image-cloud {
    position: relative;
    width: 480px;
    height: 480px;
}

.tech-item {
    width: 85px;
    position: absolute;
    animation: float 4s ease-in-out infinite;
    transition: transform 0.3s;
}

.tech-item:hover {
    transform: scale(1.15);
}

/* Floating Animation */
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-14px); }
    100% { transform: translateY(0px); }
}

/* Positions: Images placed "anga anga" */
.ti1 { top: 10%; left: 20%; animation-delay: 0s; }
.ti2 { top: 55%; left: 10%; animation-delay: 0.3s; }
.ti3 { top: 25%; left: 60%; animation-delay: 0.6s; }
.ti4 { top: 70%; left: 50%; animation-delay: 0.9s; }
.ti5 { top: 40%; left: 35%; animation-delay: 1.1s; }
.ti6 { top: 5%; left: 70%; animation-delay: 1.4s; }
.ti7 { top: 78%; left: 15%; animation-delay: 1.7s; }
.ti8 { top: 35%; left: 5%; animation-delay: 2s; }

/* Responsive */
@media (max-width: 900px) {
    .hero-flex {
        flex-direction: column;
        text-align: center;
    }
    .hero-image-cloud {
        width: 100%;
        height: 300px;
    }
}


        .cta-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s ease forwards 0.9s;
        }

        .cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: var(--secondary);
            color: white;
            padding: 16px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
        }

        .cta-btn:hover {
            background: var(--secondary-dark);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.4);
        }

.cta-btn.secondary {
    background: #f0f0f0;
    color: #222 !important;
    border: 2px solid #222;
}
.cta-btn.secondary:hover {
    background: #222;
    color: #fff !important;
}


        /* Features Section */
        .features {
            padding: 100px 0;
            background: white;
        }

        .section-title {
            text-align: center;
            margin-bottom: 70px;
            opacity: 0;
            transform: translateY(30px);
        }

        .section-title.visible {
            animation: fadeUp 0.8s ease forwards;
        }

        .section-title h2 {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--dark), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .section-title p {
            font-size: 1.1rem;
            color: var(--text-light);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            align-items: stretch;
        }

        .feature-card {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateY(30px);
        }

        .feature-card.visible {
            animation: fadeUp 0.8s ease forwards;
        }

        .feature-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
        }

        .feature-icon {
            width: 70px;
            height: 70px;
            background: var(--gradient);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            font-size: 1.8rem;
            color: white;
            transition: all 0.3s ease;
        }

        .feature-card:hover .feature-icon {
            transform: scale(1.1) rotate(5deg);
        }

        .feature-card h3 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--dark);
            line-height: 1.3;
        }

        .feature-card p {
            color: var(--text-light);
            line-height: 1.6;
            flex-grow: 1;
        }

        /* About Section */
        .about-preview {
            padding: 100px 0;
            background: var(--light);
        }

        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .about-text {
            opacity: 0;
            transform: translateX(-30px);
        }

        .about-text.visible {
            animation: fadeLeft 0.8s ease forwards;
        }

        .about-text h2 {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 25px;
            background: linear-gradient(135deg, var(--dark), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .about-text p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: var(--text);
            line-height: 1.7;
        }

        .about-image {
            opacity: 0;
            transform: translateX(30px);
        }

        .about-image.visible {
            animation: fadeRight 0.8s ease forwards;
        }

        /* About Image Styles */
        .about-image-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            height: 450px;
            background: var(--gradient);
        }

        .about-office-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.4s ease;
        }

        .about-office-image:hover {
            transform: scale(1.05);
        }

        .about-image-fallback {
            display: none;
            width: 100%;
            height: 100%;
            background: var(--gradient);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            border-radius: 12px;
        }

        .about-image-fallback i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .about-image-fallback span {
            font-size: 1.2rem;
            font-weight: 500;
        }

        /* Stats Section */
        .stats {
            padding: 80px 0;
            background: var(--gradient);
            color: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 40px;
            text-align: center;
        }

        .stat-item {
            opacity: 0;
            transform: translateY(30px);
        }

        .stat-item.visible {
            animation: fadeUp 0.8s ease forwards;
        }

        .stat-number {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .stat-label {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 500;
        }

        /* Footer */
        footer {
            background: var(--dark);
            color: white;
            padding: 70px 0 25px;
        }

        .footer-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
            margin-bottom: 50px;
        }

        .footer-column h3 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            position: relative;
            padding-bottom: 12px;
            font-weight: 600;
        }

        .footer-column h3::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 35px;
            height: 3px;
            background: var(--primary);
        }

        .footer-column p {
            color: #bdc3c7;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .footer-column ul {
            list-style: none;
        }

        .footer-column ul li {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .footer-column ul li i {
            margin-right: 10px;
            color: var(--primary);
            width: 16px;
            font-size: 14px;
        }

        .footer-column a {
            color: #bdc3c7;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .footer-column a:hover {
            color: var(--primary);
            padding-left: 5px;
        }

        .social-icons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .social-icons a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .social-icons a:hover {
            background: var(--primary);
            transform: translateY(-3px);
        }

        .copyright {
            text-align: center;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #bdc3c7;
            font-size: 14px;
        }

        /* Animations */
        @keyframes fadeUp {
            to {
                opacity: 1;

            }

            to {

    <script>
        // Enhanced JavaScript for animations and interactions
        document.addEventListener('DOMContentLoaded', function() {
            // Header scroll effect
            const header = document.getElementById('header');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            });

            // Mobile menu toggle
            const mobileMenu = document.querySelector('.mobile-menu');
            const navLinks = document.querySelector('.nav-links');
            mobileMenu.addEventListener('click', () => {
                navLinks.classList.toggle('active');
                const icon = mobileMenu.querySelector('i');
                icon.classList.toggle('fa-bars');
                icon.classList.toggle('fa-times');
            });

            // Smooth scrolling for navigation links
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        target.scrollIntoView({
                            behavior: 'smooth',
                            block: 'start'
                        });
                        // Close mobile menu
                        navLinks.classList.remove('active');
                        mobileMenu.querySelector('i').classList.add('fa-bars');
                        mobileMenu.querySelector('i').classList.remove('fa-times');
                    }
                });
            });

            // Intersection Observer for animations
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        
                        // Animate stats counting
                        if (entry.target.classList.contains('stat-item')) {
                            const statNumber = entry.target.querySelector('.stat-number');
                            const target = parseInt(statNumber.getAttribute('data-count'));
                            let current = 0;
                            const increment = target / 50;
                            const timer = setInterval(() => {
                                current += increment;
                                if (current >= target) {
                                    clearInterval(timer);
                                    current = target;
                                }
                                statNumber.textContent = Math.floor(current);
                            }, 30);
                        }
                    }
                });
            }, observerOptions);

            // Observe elements
            document.querySelectorAll('.section-title, .feature-card, .about-text, .about-image, .stat-item').forEach(el => {
                observer.observe(el);
            });

            // Logo error handling
            const logoImg = document.querySelector('.logo-img');
            const logoFallback = document.getElementById('logoFallback');
            
            if (logoImg) {
                logoImg.onerror = function() {
                    this.style.display = 'none';
                    if (logoFallback) {
                        logoFallback.style.display = 'flex';
                        logoFallback.style.alignItems = 'center';
                        logoFallback.style.justifyContent = 'center';
                    }
                };
                
                // Check if image loaded successfully after a delay
                setTimeout(() => {
                    if (logoImg.naturalHeight === 0) {
                        logoImg.style.display = 'none';
                        if (logoFallback) {
                            logoFallback.style.display = 'flex';
                            logoFallback.style.alignItems = 'center';
                            logoFallback.style.justifyContent = 'center';
                        }
                    }
                }, 1000);
            }

            // About image error handling
            const aboutImage = document.querySelector('.about-office-image');
            const officeFallback = document.getElementById('officeFallback');
            
            if (aboutImage) {
                aboutImage.onerror = function() {
                    this.style.display = 'none';
                    if (officeFallback) {
                        officeFallback.style.display = 'flex';
                    }
                };
                
                // Check if about image loaded successfully after a delay
                setTimeout(() => {
                    if (aboutImage.naturalHeight === 0) {
                        aboutImage.style.display = 'none';
                        if (officeFallback) {
                            officeFallback.style.display = 'flex';
                        }
                    }
                }, 1000);
            }
        });

        // ------------------ Date ------------------
        function updateDate() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById("currentDate").innerText = now.toLocaleDateString("en-IN", options);
        }
        updateDate();

// ------------------ Time (Hours and Minutes only) ------------------
function updateTime() {
    const now = new Date();
    // Format time as HH:MM (24-hour format) with no extra spaces
    const timeString = now.toLocaleTimeString("en-IN", {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
    }).replace(/\s/g, ''); // Remove any spaces
    
    document.getElementById("currentTime").innerText = timeString;
}

        // ------------------ Weather ------------------
        function getWeatherIcon(condition) {
            const weatherIcons = {
                'Clear': 'fas fa-sun',
                'Clouds': 'fas fa-cloud',
                'Rain': 'fas fa-cloud-rain',
                'Drizzle': 'fas fa-cloud-drizzle',
                'Thunderstorm': 'fas fa-bolt',
                'Snow': 'fas fa-snowflake',
                'Mist': 'fas fa-smog',
                'Smoke': 'fas fa-smog',
                'Haze': 'fas fa-smog',
                'Dust': 'fas fa-smog',
                'Fog': 'fas fa-smog',
                'Sand': 'fas fa-smog',
                'Ash': 'fas fa-smog',
                'Squall': 'fas fa-wind',
                'Tornado': 'fas fa-tornado'
            };
            
            return weatherIcons[condition] || 'fas fa-cloud-sun';
        }

        function getWeather(lat, lon) {
            // For production, you should get this from your backend
            const API_KEY = "fea0d19a2a7ecd9dd2a1c68832b4034a";

            fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Weather API error');
                    }
                    return response.json();
                })
                .then(data => {
                    const temp = Math.round(data.main.temp);
                    const city = data.name;
                    const condition = data.weather[0].main;
                    const iconClass = getWeatherIcon(condition);

                    // Update weather display
                    document.getElementById("weatherTemp").innerText = `${temp}°C`;
                    document.getElementById("weatherLocation").innerText = city;
                    document.getElementById("weatherIcon").innerHTML = `<i class="${iconClass}"></i>`;
                })
                .catch((error) => {
                    console.error('Weather fetch error:', error);
                    document.getElementById("weatherTemp").innerText = "--°C";
                    document.getElementById("weatherLocation").innerText = "Weather unavailable";
                });
        }

        // Get user location with better error handling
        function getUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        getWeather(position.coords.latitude, position.coords.longitude);
                    },
                    (error) => {
                        console.error('Geolocation error:', error);
                        // Fallback to a default location (Delhi coordinates)
                        getWeather(28.6139, 77.2090);
                    },
                    {
                        timeout: 10000, // 10 seconds timeout
                        enableHighAccuracy: false // Faster response
                    }
                );
            } else {
                document.getElementById("weatherLocation").innerText = "Location not supported";
                // Fallback to a default location
                getWeather(28.6139, 77.2090);
            }
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            updateDate();
            updateTime();
            getUserLocation();
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
